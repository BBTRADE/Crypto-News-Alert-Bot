# 30分ごとにニュースをDiscordへ配信（重要ニュースのみ・前回送信済みは除外）
name: News Alert (30min)
on:
  schedule:
    - cron: '*/30 * * * *'   # 30分ごと (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DISCORD_WEBHOOK_URL_30M: ${{ secrets.DISCORD_WEBHOOK_URL_30M }}
  ALERT_30M_IMPORTANT_ONLY: "1"
  # 本番環境: 30分間のニュースを取得
  ALERT_30M_MINUTES: "30"
  # 翻訳用（英語ニュースを日本語に自動翻訳）
  GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
  GLM_API_URL: ${{ secrets.GLM_API_URL }}
  GLM_MODEL: ${{ secrets.GLM_MODEL }}

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 送信済みリンクのキャッシュを復元
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: posted-links-30m-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            posted-links-30m-v2-
            posted-links-30m-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 30min alert
        run: python alert_30m.py
      # 送信済みリンクのキャッシュを保存
      - uses: actions/cache/save@v6
        if: always() && hashFiles('.cache/posted_links_30m.txt') != ''
        with:
          path: .cache
          key: posted-links-30m-v2-${{ github.run_id }}-${{ github.run_attempt }}
